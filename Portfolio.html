<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Anusha Prasad — UX Designer &amp; Researcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root{
      --bg:#080808; --text:#F2EDE4;
      --muted:rgba(242,237,228,0.48); --faint:rgba(242,237,228,0.22);
      --bdr:rgba(242,237,228,0.08);
      --green:#BDD99F; --amber:#F5A623; --cream:#F0E6D3; --purple:#C77DFF;
      --serif:'Cormorant Garamond',Georgia,serif;
      --display:'DM Sans',system-ui,sans-serif;
      --hero-name:'DM Sans',system-ui,sans-serif;
      --sans:'DM Sans',system-ui,sans-serif;
      --mono:'JetBrains Mono',monospace;
      --hand:'Cormorant Garamond',Georgia,serif;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);overflow-x:hidden;
      font-family:var(--sans);cursor:none;-webkit-font-smoothing:antialiased;}
    a,button{cursor:none;} img{display:block;}

    /* ── PROGRESS ── */
    #pg{position:fixed;top:0;left:0;height:1.5px;background:var(--green);z-index:9000;width:0;pointer-events:none;}

    /* ── CURSOR — industry-standard: blend-mode dot + smooth lagging ring ── */
    #c-dot{width:6px;height:6px;background:#fff;border-radius:50%;
      position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);
      mix-blend-mode:difference;
      transition:width .18s cubic-bezier(0.16,1,0.3,1),height .18s cubic-bezier(0.16,1,0.3,1),opacity .2s;}
    #c-ring{position:fixed;pointer-events:none;z-index:9998;border-radius:50%;
      width:36px;height:36px;transform:translate(-50%,-50%);
      border:1px solid rgba(242,237,228,0.28);
      transition:width .5s cubic-bezier(0.16,1,0.3,1),height .5s cubic-bezier(0.16,1,0.3,1),
                 border-color .3s,background .3s,border-width .3s;}
    body.c-link #c-dot{width:10px;height:10px;}
    body.c-link #c-ring{width:56px;height:56px;background:rgba(189,217,159,0.05);border-color:rgba(189,217,159,0.55);border-width:1.5px;}
    body.c-img  #c-ring{width:88px;height:88px;background:rgba(189,217,159,0.06);border-color:var(--green);}
    body.c-text #c-dot{width:2px;height:20px;border-radius:1px;}
    body.c-text #c-ring{width:0px;height:0px;opacity:0;}

    /* ── COUNTER ── */
    #sc{position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:200;
      display:flex;flex-direction:column;align-items:center;gap:8px;
      opacity:0;transition:opacity .4s;}
    #sc.on{opacity:1;}
    .sc-ln{width:1px;height:36px;background:var(--bdr);}
    .sc-n{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--faint);}
    .sc-d{width:5px;height:5px;border-radius:50%;border:1px solid rgba(242,237,228,.18);transition:all .35s;}
    .sc-d.on{background:var(--green);border-color:var(--green);transform:scale(1.3);}

    /* ── CLIP REVEAL ── */
    .rmask{display:block;overflow:hidden;}
    .rinner{display:block;transform:translateY(105%);transition:transform 1.05s cubic-bezier(0.16,1,0.3,1);}
    .rinner--up{transform:translateY(0);}

    /* ── SECTION DIVIDER ── */
    .sdiv{width:100%;height:1px;overflow:hidden;}
    .sdiv__fill{height:100%;background:linear-gradient(90deg,transparent,var(--green) 40%,var(--amber) 72%,transparent);
      transform:scaleX(0);transform-origin:left;transition:transform 1.4s cubic-bezier(0.16,1,0.3,1);}
    .sdiv__fill.vis{transform:scaleX(1);}

    /* ── DRAW PATH ── */
    .draw-path{stroke-dasharray:2000;stroke-dashoffset:2000;
      transition:stroke-dashoffset 2s cubic-bezier(0.16,1,0.3,1);}
    .draw-path.drawn{stroke-dashoffset:0;}

    /* ── NAV ── */
    .nav{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:300;}
    .nav__pill{display:flex;align-items:center;gap:2px;
      background:rgba(255,255,255,.03);backdrop-filter:blur(32px);
      border:1px solid var(--bdr);border-radius:50px;padding:6px 8px 6px 6px;
      transition:background .4s,border-color .4s,box-shadow .4s;}
    .nav--sc .nav__pill{background:rgba(8,8,8,.94);border-color:rgba(189,217,159,.22);box-shadow:0 4px 32px rgba(0,0,0,.6);}
    .nav__logo{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;
      margin-right:4px;display:flex;align-items:center;justify-content:center;
      transition:transform .4s cubic-bezier(0.16,1,0.3,1);}
    .nav__logo:hover{transform:scale(1.12) rotate(-8deg);}
    .nav__link{position:relative;overflow:hidden;padding:7px 18px;border-radius:40px;
      font-size:13px;font-weight:400;color:var(--muted);transition:color .2s;display:inline-flex;align-items:center;}
    .nav__link::after{content:'';position:absolute;inset:0;background:rgba(189,217,159,.9);
      border-radius:40px;transform:translateY(101%);transition:transform .45s cubic-bezier(0.16,1,0.3,1);z-index:-1;}
    .nav__link:hover{color:#000;} .nav__link:hover::after{transform:translateY(0);}
    .nav__link--active{background:var(--green);color:#000;}
    .nav__resume{padding:7px 18px 7px 14px;border-radius:40px;font-size:13px;font-weight:500;
      color:var(--green);border:1px solid rgba(189,217,159,.3);margin-left:4px;
      display:inline-flex;align-items:center;gap:5px;transition:all .25s;}
    .nav__resume:hover{background:var(--green);color:#000;border-color:var(--green);}

    /* ── HERO ── */
    .hero{height:100vh;display:grid;grid-template-columns:1fr 1fr;
      align-items:center;overflow:hidden;position:relative;padding:0 80px;z-index:1;}
    .hero__bg{position:absolute;inset:0;will-change:transform;transform-origin:center;
      background-image:linear-gradient(rgba(242,237,228,.032) 1px,transparent 1px),
        linear-gradient(90deg,rgba(242,237,228,.032) 1px,transparent 1px);
      background-size:72px 72px;}
    .hero__vectors{position:absolute;inset:0;pointer-events:none;overflow:visible;}
    /* scroll-linked transition overlay — blends hero into next section */
    .hero__transition{position:absolute;bottom:0;left:0;right:0;height:50vh;pointer-events:none;
      background:linear-gradient(to bottom,transparent 0%,rgba(8,8,8,0.4) 60%,var(--bg) 100%);z-index:3;}

    .hero__left{position:relative;z-index:2;padding-top:100px;padding-bottom:60px;}
    /* UX DESIGNER label — bigger, white */
    .hero__meta{display:flex;align-items:center;gap:14px;margin-bottom:40px;
      opacity:0;transform:translateY(10px);
      transition:opacity .7s cubic-bezier(0.16,1,0.3,1),transform .7s cubic-bezier(0.16,1,0.3,1);}
    .hero__meta-line{width:32px;height:1.5px;background:var(--green);}
    .hero__meta-text{font-family:var(--mono);font-size:16px;letter-spacing:.15em;
      text-transform:uppercase;color:#ffffff;font-weight:600;}
    .hero__greeting{font-family:var(--hand);font-style:italic;font-weight:400;font-size:38px;color:var(--green);
      line-height:1;margin-bottom:4px;
      opacity:0;transform:translateY(14px);
      transition:opacity .6s cubic-bezier(0.16,1,0.3,1),transform .6s cubic-bezier(0.16,1,0.3,1);}
    /* Bricolage Grotesque — expressive, variable, excellent readability at display size */
    .hero__title{display:block;font-family:var(--hero-name);font-weight:800;
      font-size:clamp(64px,9vw,128px);line-height:.88;letter-spacing:-.02em;}
    .hero__name-solid,.hero__name-outline{display:block;overflow:hidden;}
    .hero__name-inner{display:block;transform:translateY(108%);transition:transform 1s cubic-bezier(0.16,1,0.3,1);}
    .hero__name-outline .hero__name-inner{-webkit-text-stroke:2px var(--cream);color:transparent;}
    .hero__foot{display:flex;flex-direction:column;gap:20px;margin-top:44px;
      opacity:0;transform:translateY(12px);
      transition:opacity .7s cubic-bezier(0.16,1,0.3,1),transform .7s cubic-bezier(0.16,1,0.3,1);}
    .hero__role{font-size:15px;color:var(--muted);line-height:1.65;}
    .hero__actions{display:flex;gap:12px;}
    .hero__scroll{position:absolute;bottom:36px;left:80px;display:flex;align-items:center;gap:14px;
      opacity:0;transition:opacity .6s cubic-bezier(0.16,1,0.3,1);z-index:4;}
    .hero__scroll span{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);}
    .hero__scroll-line{width:56px;height:1px;background:linear-gradient(to right,var(--green),transparent);
      animation:breathe 2.6s ease-in-out infinite;}
    @keyframes breathe{0%,100%{opacity:.25;transform:scaleX(1)}50%{opacity:.8;transform:scaleX(1.15)}}
    .h-meta{opacity:1!important;transform:none!important;}
    .h-greet{opacity:1!important;transform:none!important;}
    .h-solid .hero__name-inner,.h-outline .hero__name-inner{transform:translateY(0)!important;}
    .h-foot{opacity:1!important;transform:none!important;}
    .h-scroll{opacity:1!important;}

    /* ── HERO RIGHT ── */
    .hero__right{position:relative;z-index:2;height:100vh;display:flex;align-items:center;justify-content:center;}
    .hero__illus-wrap{position:relative;width:520px;height:520px;}
    .hero__illus{width:100%;height:100%;object-fit:contain;will-change:transform;
      animation:illusFloat 7s ease-in-out infinite;
      filter:drop-shadow(0 40px 80px rgba(189,217,159,.18));}
    @keyframes illusFloat{0%,100%{transform:translateY(0) rotate(-1deg);}33%{transform:translateY(-18px) rotate(1deg);}66%{transform:translateY(-8px) rotate(0deg);}}
    .hero__orbit{position:absolute;inset:0;border-radius:50%;pointer-events:none;}
    .hero__orbit svg{width:100%;height:100%;}
    .hero__orbit--1{inset:-40px;animation:orbitSpin 22s linear infinite;}
    .hero__orbit--2{inset:-80px;animation:orbitSpin 38s linear infinite reverse;}
    @keyframes orbitSpin{to{transform:rotate(360deg)}}
    .hero__credit{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);
      display:inline-flex;align-items:center;gap:8px;
      font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
      color:var(--faint);background:rgba(8,8,8,.6);backdrop-filter:blur(8px);
      padding:7px 14px;border-radius:24px;border:1px solid var(--bdr);
      opacity:0;animation:fadeUp .9s 1.4s forwards;white-space:nowrap;}
    .hero__credit svg{color:var(--green);}
    @keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%);}}

    /* ── BUTTONS ── */
    .btn-primary{display:inline-flex;align-items:center;gap:8px;padding:13px 30px;
      border-radius:30px;background:var(--green);color:#000;font-size:14px;font-weight:600;
      transition:transform .28s cubic-bezier(0.16,1,0.3,1),box-shadow .28s;}
    .btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(189,217,159,.3);}
    .btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:13px 30px;
      border-radius:30px;border:1px solid var(--bdr);font-size:14px;color:var(--muted);transition:all .25s;}
    .btn-ghost:hover{border-color:rgba(189,217,159,.4);color:var(--green);}

    /* ── MARQUEE ── */
    .marquee{overflow:hidden;padding:17px 0;border-top:1px solid var(--bdr);border-bottom:1px solid var(--bdr);}
    .marquee__inner{display:flex;width:max-content;animation:mRoll 42s linear infinite;}
    .marquee__inner:hover{animation-play-state:paused;}
    @keyframes mRoll{to{transform:translateX(-50%);}}
    .marquee__item{display:flex;align-items:center;gap:16px;padding:0 28px;
      font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;}
    .marquee__sep{color:var(--green);opacity:.55;}

    /* ── SECTION LABELS ── */
    .section-label{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;
      color:#ffffff;display:block;margin-bottom:10px;font-weight:600;}
    .section-title{font-family:var(--serif);font-size:clamp(40px,5.5vw,76px);font-weight:300;line-height:1.02;color:var(--text);}
    .section-title em{font-style:italic;color:var(--cream);}

    /* ── BIO — slides up as hero exits, creating seamless transition ── */
    .bio{padding:150px 80px;position:relative;z-index:2;}
    .bio__inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:200px 1fr;gap:60px;align-items:start;}
    .bio__text{font-family:var(--serif);font-size:clamp(30px,4vw,52px);font-weight:300;line-height:1.28;color:var(--text);}
    .bio__text em{font-style:italic;color:var(--green);}
    .bio__cta{display:inline-flex;align-items:center;gap:6px;margin-top:36px;font-size:15px;
      font-weight:600;color:var(--green);border-bottom:1px solid rgba(189,217,159,.3);
      padding-bottom:4px;transition:gap .3s cubic-bezier(0.16,1,0.3,1),border-color .25s;}
    .bio__cta:hover{gap:14px;border-color:var(--green);}

    /* ── PROJECTS ── */
    .projects{position:relative;}
    .projects__sticky{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
    .projects__hdr{flex-shrink:0;padding:40px 80px 0;}
    .projects__track-wrap{flex:1;position:relative;overflow:hidden;margin-top:48px;}
    .projects__track{position:absolute;inset:0;display:flex;align-items:center;
      will-change:transform;transition:transform .85s cubic-bezier(0.16,1,0.3,1);}
    .pcard{flex-shrink:0;width:100vw;padding:0 80px 40px;display:flex;align-items:center;justify-content:center;}
    .pcard__inner{width:100%;max-width:960px;border-radius:20px;overflow:hidden;
      border:1px solid var(--bdr);
      background:linear-gradient(160deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
      box-shadow:0 32px 80px rgba(0,0,0,.5);transition:box-shadow .4s;}
    .pcard__inner:hover{box-shadow:0 40px 100px rgba(0,0,0,.7);}
    .pcard__img{height:280px;overflow:hidden;position:relative;}
    .pcard__img img{width:100%;height:130%;object-fit:cover;transition:transform .8s cubic-bezier(0.16,1,0.3,1);}
    .pcard__inner:hover .pcard__img img{transform:scale(1.04);}
    .pcard__img-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
    .pcard__num-tag{position:absolute;top:14px;right:18px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;opacity:.6;}
    .pcard__body{padding:28px 36px 30px;}
    .pcard__head{display:flex;align-items:center;gap:16px;margin-bottom:10px;}
    .pcard__num{font-family:var(--serif);font-size:32px;font-weight:300;line-height:1;}
    .pcard__type{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);}
    .pcard__title{font-family:var(--display);font-size:24px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em;}
    .pcard__sub{font-size:13px;font-weight:500;margin-bottom:10px;}
    .pcard__desc{font-size:14px;color:var(--muted);line-height:1.72;margin-bottom:14px;}
    .pcard__tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
    .pcard__tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
      padding:4px 10px;border-radius:20px;border:1px solid var(--bdr);color:var(--faint);}
    .pcard__foot{display:flex;justify-content:space-between;align-items:center;}
    .pcard__link{position:relative;overflow:hidden;isolation:isolate;
      display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;
      padding:9px 20px;border-radius:22px;border:1px solid currentColor;transition:color .35s;}
    .pcard__link::before{content:'';position:absolute;inset:0;background:currentColor;
      transform:translateY(101%);transition:transform .48s cubic-bezier(0.16,1,0.3,1);z-index:-1;border-radius:22px;}
    .pcard__link:hover::before{transform:translateY(0);}
    .pcard__link:hover{color:#000!important;}
    .projects__nav{display:flex;align-items:center;justify-content:center;gap:16px;
      padding-bottom:24px;flex-shrink:0;position:relative;}
    .proj-dot{width:6px;height:6px;border-radius:50%;border:1px solid var(--faint);background:transparent;transition:all .35s;}
    .proj-dot--on{background:var(--green);border-color:var(--green);transform:scale(1.5);width:20px;border-radius:4px;}
    .proj-ctr{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em;position:absolute;right:80px;bottom:0;}

    /* ── SKILLS — prominent one-line rows ── */
    .skills{padding:140px 80px;position:relative;}
    .skills::before{content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(189,217,159,.04),transparent 70%);
      pointer-events:none;}
    .skills__inner{max-width:1180px;margin:0 auto;position:relative;}
    .skills__hdr{margin-bottom:72px;}
    .skills__rows{border-top:1px solid rgba(242,237,228,.18);}
    .skill-row2{position:relative;display:grid;grid-template-columns:56px 1fr auto;align-items:center;
      gap:32px;padding:0;border-bottom:1px solid rgba(242,237,228,.18);cursor:default;overflow:hidden;
      opacity:0;transform:translateY(18px);
      transition:opacity .6s cubic-bezier(0.16,1,0.3,1),transform .6s cubic-bezier(0.16,1,0.3,1);}
    .skill-row2.vis{opacity:1;transform:none;}
    .skill-row2__bg{position:absolute;inset:0;background:linear-gradient(90deg,var(--green),transparent 65%);
      opacity:0;transform:scaleX(.2);transform-origin:left;
      transition:opacity .5s cubic-bezier(0.16,1,0.3,1),transform .6s cubic-bezier(0.16,1,0.3,1);pointer-events:none;}
    .skill-row2:hover .skill-row2__bg{opacity:.08;transform:scaleX(1);}
    .skill-row2__inner{position:relative;z-index:1;display:grid;grid-template-columns:56px 1fr auto;align-items:center;
      gap:32px;padding:26px 0;width:100%;transition:padding .35s cubic-bezier(0.16,1,0.3,1);}
    .skill-row2:hover .skill-row2__inner{padding:34px 18px;}
    .skill-row2__num{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.14em;font-weight:500;
      transition:color .3s;}
    .skill-row2:hover .skill-row2__num{color:var(--green);}
    .skill-row2__name{font-family:var(--display);font-size:clamp(22px,2.6vw,34px);font-weight:700;
      letter-spacing:-.015em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      transition:color .3s,transform .4s cubic-bezier(0.16,1,0.3,1);}
    .skill-row2:hover .skill-row2__name{color:var(--green);transform:translateX(6px);}
    .skill-row2__tools{font-family:var(--mono);font-size:11.5px;color:var(--faint);text-align:right;
      letter-spacing:.06em;white-space:nowrap;transition:color .3s;font-weight:500;}
    .skill-row2:hover .skill-row2__tools{color:rgba(189,217,159,.72);}
    .skill-row2__bar{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--green);
      transition:width .85s cubic-bezier(0.16,1,0.3,1);z-index:2;}
    .skill-row2:hover .skill-row2__bar{width:100%;}

    /* ── FOOTER ── */
    .footer{position:relative;overflow:hidden;padding-bottom:60px;}
    .footer__line{height:2px;width:100%;transform-origin:left;
      background:linear-gradient(90deg,transparent,var(--green) 25%,var(--amber) 60%,var(--purple) 85%,transparent);}
    .footer__inner{max-width:1100px;margin:0 auto;padding:96px 80px 0;}
    .footer__lbl{margin-bottom:24px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--text);font-weight:500;}
    .footer__title-wrap{margin-bottom:48px;}
    .footer__tline{display:block;font-family:var(--serif);font-size:clamp(52px,9.5vw,130px);font-weight:300;line-height:.92;}
    .footer__tline--em em{font-style:italic;color:var(--cream);}
    .footer__email{display:inline-flex;align-items:center;gap:14px;
      font-size:clamp(15px,1.8vw,22px);font-weight:300;color:var(--muted);
      border-bottom:1px solid var(--bdr);padding-bottom:14px;transition:color .25s,border-color .25s;}
    .footer__email:hover{color:var(--green);border-color:rgba(189,217,159,.4);}
    .footer__earrow{transition:transform .22s;}
    .footer__email:hover .footer__earrow{transform:translate(4px,-4px);}
    .footer__bottom{display:flex;justify-content:space-between;align-items:center;
      padding-top:52px;border-top:1px solid var(--bdr);flex-wrap:wrap;gap:16px;}
    .footer__socials{display:flex;gap:28px;}
    .footer__social{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;transition:color .22s;}
    .footer__social:hover{color:var(--green);}
    .footer__rhs{display:flex;gap:28px;align-items:center;}
    .footer__copy{font-size:12px;color:var(--faint);}
    .footer__bg{position:absolute;bottom:-60px;right:52px;font-family:var(--display);
      font-size:260px;font-weight:800;color:rgba(255,255,255,.018);
      pointer-events:none;user-select:none;letter-spacing:-.04em;line-height:1;}

    /* ══ ABOUT SECTION (inlined from About page) ══════════════════ */
    .about{position:relative;}
    /* about hero */
    .ah-hero{min-height:100vh;display:flex;align-items:center;overflow:hidden;position:relative;}
    .ah-hero__bg{position:absolute;inset:0;will-change:transform;
      background:radial-gradient(ellipse 60% 50% at 80% 40%,rgba(189,217,159,.07),transparent),
                 radial-gradient(ellipse 40% 40% at 20% 70%,rgba(114,66,167,.06),transparent);}
    .ah-hero__bg::after{content:'';position:absolute;inset:0;
      background-image:linear-gradient(rgba(189,217,159,.025) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(189,217,159,.025) 1px,transparent 1px);
      background-size:56px 56px;}
    .ah-hero__content{position:relative;z-index:2;width:100%;max-width:1200px;margin:0 auto;
      padding:0 80px;display:flex;align-items:center;justify-content:space-between;gap:60px;}
    .ah-hero__left{flex:1;}
    .ah-hero__title{font-family:var(--serif);font-size:clamp(72px,10vw,138px);font-weight:300;line-height:.95;display:block;}
    .ah-hero__title-line{display:block;white-space:nowrap;}
    .ah-hero__title-line em{font-style:italic;color:var(--cream);}
    .ah-hero__tagline{font-family:var(--sans);font-size:15px;color:var(--muted);line-height:1.6;margin-top:28px;}
    .dot-pill{display:inline-block;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:500;
      letter-spacing:.07em;text-transform:uppercase;border:1px solid rgba(189,217,159,.25);color:var(--muted);margin:16px 8px 0 0;}
    .ah-hero__right{flex-shrink:0;}
    .ah-hero__scroll{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
      display:flex;flex-direction:column;align-items:center;gap:10px;}
    .ascroll-lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);}
    .ascroll-ln{width:1px;height:52px;background:linear-gradient(to bottom,var(--green),transparent);
      animation:aPulse 2.2s ease-in-out infinite;}
    @keyframes aPulse{0%,100%{opacity:.5;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.3)}}
    /* sticker */
    .sticker-wrap{transform:rotate(-6deg);filter:drop-shadow(0 20px 40px rgba(0,0,0,.7));}
    .sticker{width:320px;background:#fff;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;}
    .sticker__top{background:#FF2D2D;padding:14px 20px 12px;display:flex;flex-direction:column;border-radius:6px 6px 0 0;}
    .sticker__hello{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.08em;color:#fff;text-align:center;}
    .sticker__subtitle{font-family:var(--display);font-weight:700;font-size:20px;color:rgba(255,255,255,.9);text-align:center;}
    .sticker__body{padding:20px 24px 16px;flex:1;background:#fff;display:flex;align-items:center;justify-content:center;}
    .sticker__name{font-family:var(--hand);font-size:32px;line-height:1.3;color:#000;text-align:center;}
    .sticker__bottom{background:#FF2D2D;height:32px;border-radius:0 0 6px 6px;}
    /* quote */
    .aq-section{padding:120px 80px;overflow:hidden;}
    .aq-section__inner{max-width:1100px;margin:0 auto;display:flex;gap:60px;}
    .aq-section__bar{width:3px;background:var(--green);flex-shrink:0;transform-origin:top;border-radius:2px;min-height:200px;}
    .aq-section__text{flex:1;}
    .aq-section__label{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.18em;
      text-transform:uppercase;color:#fff;margin-bottom:28px;}
    .aq-section__quote{font-family:var(--serif);font-size:clamp(24px,3.5vw,46px);font-weight:300;line-height:1.4;
      color:var(--text);margin-bottom:36px;}
    /* collage */
    .ac-section{padding:80px 80px 140px;position:relative;overflow:hidden;}
    .ac-section__header{max-width:1100px;margin:0 auto 0;}
    .ac-eyebrow{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.18em;
      text-transform:uppercase;color:#fff;margin-bottom:14px;}
    .ac-title{font-family:var(--serif);font-size:clamp(40px,6vw,80px);font-weight:300;line-height:1.05;
      color:var(--text);margin-bottom:0;}
    .ac-title em{font-style:italic;color:var(--cream);}
    .ac-section__collage{position:relative;max-width:1100px;margin:0 auto;height:780px;}
    .ac-doodle{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
    .ac-card{position:absolute;}
    .ac-card--ux{left:60px;top:80px;} .ac-card--edu{right:60px;top:280px;} .ac-card--chicago{left:200px;top:530px;}
    /* info card */
    .info-card{position:relative;cursor:pointer;display:flex;align-items:flex-start;gap:20px;
      opacity:0;transform:translateY(30px) rotate(var(--rot,0deg));transition:opacity .7s ease,transform .7s ease;}
    .info-card--visible{opacity:1;transform:translateY(0) rotate(var(--rot,0deg));}
    .info-card:hover{transform:translateY(-4px) rotate(0deg) scale(1.02)!important;}
    .info-card__img-wrap{position:relative;width:200px;height:200px;flex-shrink:0;border-radius:16px;overflow:hidden;
      box-shadow:0 12px 40px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08);transition:box-shadow .3s;}
    .info-card:hover .info-card__img-wrap{box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 0 2px var(--accent,var(--green));}
    .info-card__img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease;}
    .info-card:hover .info-card__img{transform:scale(1.06);}
    .info-card__overlay{position:absolute;inset:0;background:rgba(0,0,0,.15);opacity:0;transition:opacity .3s;border-radius:16px;}
    .info-card__overlay--visible{opacity:1;}
    .info-card__bracket{position:absolute;width:20px;height:20px;border-color:var(--accent,var(--green));border-style:solid;opacity:0;transition:opacity .3s .1s;}
    .info-card__overlay--visible .info-card__bracket{opacity:1;}
    .info-card__bracket--tl{top:8px;left:8px;border-width:2px 0 0 2px;}
    .info-card__bracket--br{bottom:8px;right:8px;border-width:0 2px 2px 0;}
    .info-card__text{opacity:0;transform:translateX(-8px);transition:opacity .35s .1s ease,transform .35s .1s ease;
      display:flex;align-items:center;max-width:220px;}
    .info-card__text--visible{opacity:1;transform:translateX(0);}
    .info-card__handwriting{font-family:var(--hand);font-size:26px;line-height:1.35;color:var(--text);white-space:pre-line;}
    /* hackathon */
    .ahack-section{padding:80px 80px 120px;}
    .ahack-section__inner{max-width:1100px;margin:0 auto;}
    .ahack-section__header{margin-bottom:56px;}
    .ahack-layout{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;}
    .ahack-photo-wrap{position:relative;}
    .ahack-photo-clip{border-radius:20px;overflow:hidden;aspect-ratio:4/3;border:1px solid rgba(255,255,255,.08);}
    .ahack-photo{width:100%;height:100%;object-fit:cover;display:block;will-change:transform;}
    .ahack-annotation{position:absolute;display:flex;align-items:center;gap:6px;
      opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease;}
    .ann-visible{opacity:1!important;transform:translateY(0)!important;}
    .ahack-annotation--me{bottom:-36px;left:24px;}
    .ann-arrow{font-size:22px;color:var(--green);transform:rotate(20deg);}
    .ann-text{color:var(--muted);}
    .ahack-frame-corner{position:absolute;width:28px;height:28px;border-color:var(--green);border-style:solid;}
    .ahack-frame-corner--tl{top:-4px;left:-4px;border-width:2px 0 0 2px;border-radius:4px 0 0 0;}
    .ahack-frame-corner--tr{top:-4px;right:-4px;border-width:2px 2px 0 0;border-radius:0 4px 0 0;}
    .ahack-frame-corner--bl{bottom:-4px;left:-4px;border-width:0 0 2px 2px;border-radius:0 0 0 4px;}
    .ahack-frame-corner--br{bottom:-4px;right:-4px;border-width:0 2px 2px 0;border-radius:0 0 4px 0;}
    .ahack-info{opacity:0;transform:translateX(32px);transition:opacity .8s .2s ease,transform .8s .2s ease;}
    .ahack-info--visible{opacity:1;transform:translateX(0);}
    .ahack-caption{color:var(--muted);margin-bottom:24px;}
    .ahack-body{font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:32px;}
    .ahack-cta{display:inline-flex;align-items:center;gap:10px;padding:13px 28px;border-radius:28px;
      background:var(--green);color:#000;font-size:14px;font-weight:600;
      transition:transform .2s,box-shadow .2s;}
    .ahack-cta:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(189,217,159,.35);}
  </style>
</head>
<body>
  <div id="pg"></div>
  <div id="sc">
    <div class="sc-ln"></div>
    <div class="sc-n" id="sc-num">01</div>
    <div class="sc-ln"></div>
    <div style="display:flex;flex-direction:column;gap:7px;align-items:center">
      <div class="sc-d" id="sd0"></div>
      <div class="sc-d" id="sd1"></div>
      <div class="sc-d" id="sd2"></div>
      <div class="sc-d" id="sd3"></div>
      <div class="sc-d" id="sd4"></div>
    </div>
    <div class="sc-ln"></div>
  </div>
  <div id="c-dot"></div>
  <div id="c-ring"></div>
  <div id="root"></div>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script>
    /* ── CURSOR — industry-standard: blend-mode dot + smooth lerp ring ── */
    const dot=document.getElementById('c-dot'),ring=document.getElementById('c-ring');
    let mx=-200,my=-200,rx=-200,ry=-200;
    window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
    document.addEventListener('mouseover',e=>{
      const isLink=e.target.closest('a,button,[data-mag]');
      const isImg=e.target.closest('.pcard__img,.hero__illus-wrap');
      const isText=e.target.closest('p,h1,h2,h3,h4,span:not(.nav__link):not(.btn-primary):not(.btn-ghost)');
      if(isImg) document.body.className='c-img';
      else if(isLink) document.body.className='c-link';
      else if(isText) document.body.className='c-text';
      else document.body.className='';
    });
    (function loop(){
      dot.style.left=mx+'px'; dot.style.top=my+'px';
      rx+=(mx-rx)*.09; ry+=(my-ry)*.09;
      ring.style.left=rx+'px'; ring.style.top=ry+'px';
      requestAnimationFrame(loop);
    })();

    /* ── SCROLL ── */
    const SECS=['hero','bio','projects','skills','contact'];
    const scEl=document.getElementById('sc'),scNum=document.getElementById('sc-num');
    const sdots=[0,1,2,3,4].map(i=>document.getElementById('sd'+i));
    window.addEventListener('scroll',()=>{
      document.getElementById('pg').style.width=Math.min(window.scrollY/(document.body.scrollHeight-window.innerHeight)*100,100)+'%';
      let ai=0;
      SECS.forEach((id,i)=>{const s=document.getElementById(id);if(s&&s.getBoundingClientRect().top<=window.innerHeight*.55)ai=i;});
      scNum.textContent=String(ai+1).padStart(2,'0');
      sdots.forEach((d,i)=>d.className='sc-d'+(i===ai?' on':''));
      scEl.className=window.scrollY>200?'on':'';
      const li=document.querySelector('.nav__logo img');
      if(li)li.style.transform=`rotate(${(window.scrollY*.06%360).toFixed(1)}deg)`;
      document.querySelectorAll('.draw-path').forEach(p=>{if(p.getBoundingClientRect().top<window.innerHeight*.9)p.classList.add('drawn');});
      document.querySelectorAll('.sdiv__fill').forEach(el=>{if(el.getBoundingClientRect().top<window.innerHeight*.92)el.classList.add('vis');});
    },{passive:true});
  </script>

  <script type="text/babel">
    const {useState,useEffect,useRef}=React;
    const RESUME='https://drive.google.com/file/d/1pCGSOcK_WixaAsxsnxSUG0tcQRmeFyM7/view';
    const FIGMA='https://www.figma.com/design/aRxz0yHHhzNLHAnDzViRw2/Portfolio-for-real';

    function Reveal({children,delay=0,tag='div'}){
      const ref=useRef(null);const[up,setUp]=useState(false);
      useEffect(()=>{
        const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setUp(true);obs.disconnect();}},{threshold:.01,rootMargin:'0px 0px -24px 0px'});
        if(ref.current)obs.observe(ref.current);return()=>obs.disconnect();
      },[]);
      const Tag=tag;
      return(<Tag className="rmask" ref={ref}><span className={`rinner${up?' rinner--up':''}`} style={{transitionDelay:`${delay}s`}}>{children}</span></Tag>);
    }

    function SDivider(){
      const ref=useRef(null);const[v,setV]=useState(false);
      useEffect(()=>{const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setV(true);obs.disconnect();}},{threshold:.1});if(ref.current)obs.observe(ref.current);return()=>obs.disconnect();},[]);
      return(<div className="sdiv" ref={ref}><div className={`sdiv__fill${v?' vis':''}`}/></div>);
    }

    function Nav({active}){
      const[sc,setSc]=useState(false);
      useEffect(()=>{const fn=()=>setSc(window.scrollY>80);window.addEventListener('scroll',fn,{passive:true});return()=>window.removeEventListener('scroll',fn);},[]);
      return(
        <nav className={`nav${sc?' nav--sc':''}`}>
          <div className="nav__pill">
            <a href="#hero" className="nav__logo">
              <img src="assets/logo.png" alt="AP" width="38" height="38" style={{borderRadius:'50%',objectFit:'cover',display:'block'}}/>
            </a>
            <div style={{display:'flex',alignItems:'center',gap:2}}>
              {[['Projects','#projects'],['About','About.html'],['Contact','#contact']].map(([l,h])=>(
                <a key={l} href={h} className={`nav__link${active===l.toLowerCase()?' nav__link--active':''}`}>{l}</a>
              ))}
              <a href={RESUME} target="_blank" rel="noopener" className="nav__resume">Resume ↗</a>
            </div>
          </div>
        </nav>
      );
    }

    function useScramble(t,active){
      const C='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const[o,setO]=useState(t);const f=useRef(0),r=useRef(null);
      useEffect(()=>{
        if(!active)return;f.current=0;const len=t.length,total=len*3.4;
        const tick=()=>{let i=0;setO(t.split('').map(ch=>{if(ch===' ')return' ';return f.current>(i++/len)*total?ch:C[~~(Math.random()*C.length)];}).join(''));f.current++;if(f.current<total+4)r.current=requestAnimationFrame(tick);else setO(t);};
        r.current=requestAnimationFrame(tick);return()=>cancelAnimationFrame(r.current);
      },[active,t]);return o;
    }

    function HeroVectors({prog}){
      return(
        <svg className="hero__vectors" viewBox="0 0 1440 900" fill="none">
          <path className="draw-path" id="vp1" d="M-20 600 C200 500,400 700,600 450 S900 200,1100 380 S1350 600,1460 500" stroke="rgba(189,217,159,0.08)" strokeWidth="1.5" strokeLinecap="round"/>
          <path className="draw-path" id="vp2" d="M0 200 C150 280,300 100,500 220 S750 350,900 240 S1150 80,1440 200" stroke="rgba(245,166,35,0.06)" strokeWidth="1" strokeLinecap="round"/>
          <path className="draw-path" id="vp3" d="M80 80 L80 140 M80 80 L140 80" stroke="rgba(189,217,159,0.2)" strokeWidth="1.5" strokeLinecap="round"/>
          <path className="draw-path" id="vp4" d="M1360 820 L1360 760 M1360 820 L1300 820" stroke="rgba(245,166,35,0.15)" strokeWidth="1.5" strokeLinecap="round"/>
          {[200,400,650,900,1150].map((x,i)=>(
            <circle key={i} cx={x} cy={80+Math.sin(i)*40} r="2" fill="rgba(189,217,159,0.18)" style={{opacity:Math.max(0,Math.min(1,prog*5-i))}}/>
          ))}
        </svg>
      );
    }

    function Hero(){
      const[go,setGo]=useState(false);
      const fn=useScramble('ANUSHA',go);
      const bgRef=useRef(null),cRef=useRef(null),illusRef=useRef(null);
      const[prog,setProg]=useState(0);
      const[s,setS]=useState({meta:false,greet:false,solid:false,outline:false,foot:false,scroll:false});
      useEffect(()=>{
        const delays={meta:50,greet:180,solid:300,outline:480,foot:780,scroll:1200};
        const ts=Object.entries(delays).map(([k,ms])=>setTimeout(()=>setS(p=>({...p,[k]:true})),ms));
        const tg=setTimeout(()=>setGo(true),180);
        const onScroll=()=>{
          const raw=window.scrollY/window.innerHeight;
          const p=Math.min(raw,1);
          setProg(p);
          // ease-in-quad curve for smoother deceleration
          const e=1-Math.pow(1-Math.min(p*1.5,1),2);
          // grid bg: scale + fade as you scroll past
          if(bgRef.current){
            bgRef.current.style.transform=`scale(${1+p*.05})`;
            bgRef.current.style.opacity=(1-p*.55).toFixed(3);
          }
          // left content: arcs up-left (parting curtain L)
          if(cRef.current){
            const fade=Math.max(0,1-e*1.5).toFixed(3);
            cRef.current.style.opacity=fade;
            cRef.current.style.transform=`translate(${(e*-28).toFixed(1)}px,${(e*-56).toFixed(1)}px)`;
            cRef.current.style.filter=`blur(${(e*3).toFixed(1)}px)`;
          }
          // illustration: arcs up-right (parting curtain R)
          if(illusRef.current){
            const e2=1-Math.pow(1-Math.min(p*1.35,1),2);
            const fade2=Math.max(0,1-e2*1.7).toFixed(3);
            illusRef.current.style.opacity=fade2;
            illusRef.current.style.transform=`translate(${(e2*36).toFixed(1)}px,${(e2*-32).toFixed(1)}px) scale(${(1-e2*.08).toFixed(3)})`;
            illusRef.current.style.filter=`blur(${(e2*2.5).toFixed(1)}px)`;
          }
        };
        window.addEventListener('scroll',onScroll,{passive:true});
        document.querySelectorAll('#vp1,#vp2,#vp3,#vp4').forEach((p,i)=>setTimeout(()=>p.classList.add('drawn'),800+i*300));
        return()=>{ts.forEach(clearTimeout);clearTimeout(tg);window.removeEventListener('scroll',onScroll);};
      },[]);
      return(
        <section className="hero" id="hero">
          <div ref={bgRef} className="hero__bg"/>
          <HeroVectors prog={prog}/>
          <div className="hero__transition"/>
          <div ref={cRef} className="hero__left">
            <div className={`hero__meta${s.meta?' h-meta':''}`}>
              <div className="hero__meta-line"/>
              <span className="hero__meta-text">UX Designer &amp; Researcher</span>
            </div>
            <div className={`hero__greeting${s.greet?' h-greet':''}`}>Hello, I'm</div>
            <h1 className="hero__title">
              <span className={`hero__name-solid${s.solid?' h-solid':''}`}><span className="hero__name-inner">{fn}</span></span>
              <span className={`hero__name-outline${s.outline?' h-outline':''}`}><span className="hero__name-inner">PRASAD</span></span>
            </h1>
            <div className={`hero__foot${s.foot?' h-foot':''}`}>
              <p className="hero__role">MS Human-Computer Interaction<br/>DePaul University, Chicago</p>
              <div className="hero__actions">
                <a href="#projects" className="btn-primary">View Work ↓</a>
                <a href={RESUME} target="_blank" rel="noopener" className="btn-ghost">Resume ↗</a>
              </div>
            </div>
          </div>
          <div className="hero__right">
            <div className="hero__illus-wrap" ref={illusRef}>
              <div className="hero__orbit hero__orbit--1">
                <svg viewBox="0 0 600 600" fill="none"><circle cx="300" cy="300" r="280" stroke="rgba(189,217,159,0.07)" strokeWidth="1" strokeDasharray="8 16"/></svg>
              </div>
              <div className="hero__orbit hero__orbit--2">
                <svg viewBox="0 0 760 760" fill="none"><circle cx="380" cy="380" r="360" stroke="rgba(245,166,35,0.05)" strokeWidth="1" strokeDasharray="4 20"/></svg>
              </div>
              <img src="assets/illustration.png" alt="Design illustration" className="hero__illus"/>
              <span className="hero__credit">
                <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 9.5L5 4l2 3 2-4.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
                A Procreate illustration I created
              </span>
            </div>
          </div>
          <div className={`hero__scroll${s.scroll?' h-scroll':''}`}>
            <span>Scroll</span><div className="hero__scroll-line"/>
          </div>
        </section>
      );
    }

    function Marquee(){
      const items=['User Research','Prototyping','Interaction Design','Content Strategy','Usability Testing','Information Architecture','HCI','Visual Design','Mixed Methods'];
      return(<div className="marquee"><div className="marquee__inner">{[...items,...items].map((it,i)=><span key={i} className="marquee__item"><span className="marquee__sep">—</span>{it}</span>)}</div></div>);
    }

    function Bio(){
      const svgRef=useRef(null);
      useEffect(()=>{
        const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting&&svgRef.current)svgRef.current.querySelectorAll('.draw-path').forEach(p=>p.classList.add('drawn'));},{threshold:.2});
        if(svgRef.current)obs.observe(svgRef.current);return()=>obs.disconnect();
      },[]);
      return(
        <section className="bio" id="bio">
          <div className="bio__inner">
            <div>
              <Reveal><span className="section-label">02 — Introduction</span></Reveal>
              <svg ref={svgRef} width="120" height="80" viewBox="0 0 120 80" fill="none" style={{marginTop:24,display:'block'}}>
                <path className="draw-path" d="M0 40 C30 10,60 70,90 30 S110 50,120 40" stroke="rgba(189,217,159,0.35)" strokeWidth="1.5" strokeLinecap="round"/>
                <circle cx="120" cy="40" r="3" fill="var(--green)" opacity=".6"/>
              </svg>
            </div>
            <div>
              <Reveal delay={.06}><p className="bio__text">I fit into every stage</p></Reveal>
              <Reveal delay={.16}><p className="bio__text">of the <em>product lifecycle</em> —</p></Reveal>
              <Reveal delay={.28}><p className="bio__text">from <em>discovery</em> to <em>launch</em>.</p></Reveal>
              <Reveal delay={.44}><a href="About.html" className="bio__cta">About me →</a></Reveal>
            </div>
          </div>
        </section>
      );
    }

    const PROJECTS=[
      {id:1,num:'01',title:'Unwind',sub:'From Tracking to Intervention',type:'Mixed-Method UX Research',year:'2026',tools:'Figma · FigJam · Mixed Methods · Inductive Coding',desc:'Designing the exit from sleep procrastination — the behavioral loop that platforms keeping you up will never fix themselves. Led end-to-end UX research from recruitment through synthesis.',tags:['UX Research','Behavioral Design','Concept Design'],img:'assets/project1-hero.png',accent:'#BDD99F',link:'case-unwind.html'},
      {id:2,num:'02',title:'DemonHacks',sub:'DePaul Hackathon Sprint',type:'UX Design Sprint · 48h',year:'2026',tools:'Figma · FigJam · React · Rapid Prototyping',desc:'48-hour hackathon at DePaul University. Rapid research, ideation and prototyping under pressure — delivering an accessible, user-centered solution with a cross-functional team.',tags:['Design Sprint','Accessibility','Prototyping'],img:'assets/hackathon.jpg',accent:'#F5A623',link:'https://github.com/Dhruvachaitanya13/Nexora.git'},
      {id:3,num:'03',title:'CNN Redesign',sub:'Website Information Architecture',type:'IA & UX Research',year:'2026',tools:'Heuristic Evaluation · Card Sorting · Tree Testing',desc:"Restructuring CNN's complex information hierarchy for improved accessibility and cognitive load reduction. Applied card sorting and tree testing to validate a new architecture across multi-platform experiences.",tags:['IA','UX Research','Accessibility'],img:'assets/case-study/cnn-thumbnail.png',accent:'#C77DFF',link:'case-cnn.html'},
      {id:4,num:'04',title:'BeeFriendly App',sub:'Forest & Honey Design System',type:'UX Design · App Design',year:'2026',tools:'Figma · UI Design · Usability Testing',desc:"A gardening companion app that helps users create bee-friendly gardens. Built a full design system with Forest & Honey color palette and 20px corner-radius shape language.",tags:['App Design','Design System','Visual Design'],img:'assets/case-study/bee-illustration.png',accent:'#84AA52',link:'case-beefriendly.html'},
    ];

    function Projects(){
      const wrapRef=useRef(null),trackRef=useRef(null);
      const[idx,setIdx]=useState(0);const n=PROJECTS.length;
      useEffect(()=>{
        const fn=()=>{
          if(!wrapRef.current)return;
          const r=wrapRef.current.getBoundingClientRect();
          const total=wrapRef.current.offsetHeight-window.innerHeight;
          const prog=Math.min(Math.max(0,-r.top)/Math.max(total,1),1);
          const ni=Math.min(Math.floor(prog*n),n-1);
          setIdx(ni);
          if(trackRef.current)trackRef.current.style.transform=`translateX(${-ni*100}vw)`;
        };
        window.addEventListener('scroll',fn,{passive:true});fn();
        return()=>window.removeEventListener('scroll',fn);
      },[]);
      return(
        <section className="projects" id="projects" ref={wrapRef} style={{height:`${n*100+60}vh`}}>
          <div className="projects__sticky">
            <div className="projects__hdr">
              <Reveal><span className="section-label">03 — Selected Work</span></Reveal>
              <Reveal delay={.1}><h2 className="section-title">Recent <em>Projects</em></h2></Reveal>
            </div>
            <div className="projects__track-wrap">
              <div className="projects__track" ref={trackRef}>
                {PROJECTS.map((p)=>(
                  <div key={p.id} className="pcard">
                    <div className="pcard__inner" style={{borderColor:`${p.accent}22`}}>
                      <div className="pcard__img" style={{background:`${p.accent}0D`}}>
                        {p.img?<img src={p.img} alt={p.title}/>
                          :<div className="pcard__img-empty"><span style={{fontFamily:'var(--mono)',color:`${p.accent}40`,fontSize:11,letterSpacing:'0.15em',textTransform:'uppercase'}}>{p.type}</span></div>}
                        <span className="pcard__num-tag" style={{color:p.accent}}>{p.num}/{n}</span>
                      </div>
                      <div className="pcard__body">
                        <div className="pcard__head">
                          <span className="pcard__num" style={{color:p.accent}}>{p.num}</span>
                          <span className="pcard__type">{p.type}</span>
                          <span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--faint)',marginLeft:'auto'}}>{p.year}</span>
                        </div>
                        <h3 className="pcard__title">{p.title}</h3>
                        <p className="pcard__sub" style={{color:p.accent}}>{p.sub}</p>
                        <p className="pcard__desc">{p.desc}</p>
                        <div className="pcard__tags">
                          {p.tags.map(t=><span key={t} className="pcard__tag" style={{borderColor:`${p.accent}30`,color:`${p.accent}AA`}}>{t}</span>)}
                        </div>
                        <div className="pcard__foot">
                          <span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--faint)'}}>{p.tools}</span>
                          {(() => {
                            const isExternal = /^https?:/.test(p.link);
                            return (
                              <a href={p.link} {...(isExternal?{target:'_blank',rel:'noopener'}:{})} className="pcard__link" style={{color:p.accent}}>View Project →</a>
                            );
                          })()}
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div className="projects__nav">
              {PROJECTS.map((_,i)=><div key={i} className={`proj-dot${i===idx?' proj-dot--on':''}`}/>)}
              <div className="proj-ctr">{String(idx+1).padStart(2,'0')} / {String(n).padStart(2,'0')}</div>
            </div>
          </div>
        </section>
      );
    }

    /* ── SKILLS — redesigned large animated rows ── */
    const SKILLS=[
      {num:'01',name:'Research & Usability',tools:'Interviews · Surveys · Think-Aloud',accent:'#BDD99F'},
      {num:'02',name:'Interaction & Visual Design',tools:'Figma · Prototyping · Design Systems',accent:'#F5A623'},
      {num:'03',name:'Information Architecture',tools:'Card Sorting · Tree Testing · IA Maps',accent:'#C77DFF'},
      {num:'04',name:'Content Strategy',tools:'Copywriting · Narrative · Messaging',accent:'#BDD99F'},
      {num:'05',name:'Human-Centered Design',tools:'Synthesis · Accessibility · Ethics',accent:'#F5A623'},
    ];

    function Skills(){
      const ref=useRef(null);const[rev,setRev]=useState(false);
      useEffect(()=>{const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting)setRev(true);},{threshold:.1});if(ref.current)obs.observe(ref.current);return()=>obs.disconnect();},[]);
      return(
        <section className="skills" id="skills" ref={ref}>
          <div className="skills__inner">
            <div className="skills__hdr">
              <Reveal><span className="section-label">04 — Expertise</span></Reveal>
              <Reveal delay={.1}><h2 className="section-title">What I <em>Bring</em></h2></Reveal>
            </div>
            <div className="skills__rows">
              {SKILLS.map((s,i)=>(
                <div key={s.num} className={`skill-row2${rev?' vis':''}`} style={{transitionDelay:`${i*.08}s`}}>
                  <div className="skill-row2__bg"/>
                  <div className="skill-row2__inner">
                    <span className="skill-row2__num">{s.num}</span>
                    <span className="skill-row2__name">{s.name}</span>
                    <span className="skill-row2__tools">{s.tools}</span>

                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ══ ABOUT SECTION COMPONENTS ══════════════════════════════════ */
    function HelloSticker(){
      return(
        <div className="sticker">
          <div className="sticker__top">
            <span className="sticker__hello">HELLO</span>
            <span className="sticker__subtitle">my name is</span>
          </div>
          <div className="sticker__body">
            <span className="sticker__name">Anusha Prasad<br/>UX Designer &amp; Researcher</span>
          </div>
          <div className="sticker__bottom"/>
        </div>
      );
    }

    function AboutHeroSection(){
      const bgRef=useRef(null),secRef=useRef(null);
      const[go,setGo]=useState(false);
      useEffect(()=>{
        const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setGo(true);obs.disconnect();}},{threshold:.08});
        if(secRef.current)obs.observe(secRef.current);
        const fn=()=>{
          if(!bgRef.current)return;
          const r=secRef.current?.getBoundingClientRect();
          if(r&&r.top<window.innerHeight&&r.bottom>0)
            bgRef.current.style.transform=`translateY(${(window.innerHeight-r.top)*.15}px)`;
        };
        window.addEventListener('scroll',fn,{passive:true});
        return()=>{obs.disconnect();window.removeEventListener('scroll',fn);};
      },[]);
      const tr=(d)=>({opacity:go?1:0,transform:go?'none':'translateY(30px)',transition:`opacity .8s ${d}s ease,transform .8s ${d}s ease`});
      return(
        <section className="ah-hero" ref={secRef}>
          <div ref={bgRef} className="ah-hero__bg"/>
          <div className="ah-hero__content">
            <div className="ah-hero__left">
              <h1 className="ah-hero__title">
                <span className="ah-hero__title-line" style={tr(.3)}>About <em>Me</em></span>
              </h1>
              <p className="ah-hero__tagline" style={tr(.5)}>MS Human-Computer Interaction<br/>DePaul University, Chicago</p>
              <div style={{...tr(.7),display:'block'}}>
                <span className="dot-pill">UX Research</span>
                <span className="dot-pill">Product Design</span>
                <span className="dot-pill">Content Strategy</span>
              </div>
            </div>
            <div className="ah-hero__right" style={tr(.45)}>
              <div className="sticker-wrap"><HelloSticker/></div>
            </div>
          </div>
          <div className="ah-hero__scroll" style={{opacity:go?1:0,transition:'opacity .8s 1s ease'}}>
            <span className="ascroll-lbl">scroll</span>
            <div className="ascroll-ln"/>
          </div>
        </section>
      );
    }

    function AboutQuoteSection(){
      const ref=useRef(null);const[rev,setRev]=useState(false);
      useEffect(()=>{
        const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setRev(true);obs.disconnect();}},{threshold:.3});
        if(ref.current)obs.observe(ref.current);return()=>obs.disconnect();
      },[]);
      const words="My background in content strategy and marketing strengthens how I communicate ideas, shape narratives, and align projects around user-centered goals.".split(' ');
      return(
        <section className="aq-section" ref={ref}>
          <div className="aq-section__inner">
            <div className="aq-section__bar" style={{transform:rev?'scaleY(1)':'scaleY(0)',transition:'transform 1s .3s cubic-bezier(0.25,0.46,0.45,0.94)'}}/>
            <div className="aq-section__text">
              <span className="aq-section__label">Background</span>
              <p className="aq-section__quote">
                {words.map((w,i)=>{
                  const bold=['content','strategy','marketing','communicate','narratives','user-centered'].includes(w.replace(/[^a-z-]/gi,'').toLowerCase());
                  return(
                    <span key={i} style={{display:'inline-block',marginRight:'0.28em',opacity:rev?1:0,transform:rev?'translateY(0)':'translateY(16px)',transition:`opacity .55s ${i*.035}s ease,transform .55s ${i*.035}s ease`}}>
                      {bold?<strong style={{color:'var(--green)',fontWeight:700}}>{w}</strong>:w}
                    </span>
                  );
                })}
              </p>
            </div>
          </div>
        </section>
      );
    }

    function AboutInfoCard({img,handwriting,label,rotation,accentColor}){
      const ref=useRef(null);const[vis,setVis]=useState(false);const[tv,setTv]=useState(false);
      useEffect(()=>{
        const o1=new IntersectionObserver(([e])=>{if(e.isIntersecting){setVis(true);o1.disconnect();}},{threshold:.3});
        const o2=new IntersectionObserver(([e])=>{if(e.isIntersecting){setTv(true);o2.disconnect();}},{threshold:.65});
        if(ref.current){o1.observe(ref.current);o2.observe(ref.current);}
        return()=>{o1.disconnect();o2.disconnect();};
      },[]);
      return(
        <div ref={ref} className={`info-card${vis?' info-card--visible':''}`} style={{'--rot':rotation,'--accent':accentColor}}>
          <div className="info-card__img-wrap">
            <img src={img} alt={label} className="info-card__img"/>
            <div className={`info-card__overlay${tv?' info-card__overlay--visible':''}`}>
              <div className="info-card__bracket info-card__bracket--tl"/>
              <div className="info-card__bracket info-card__bracket--br"/>
            </div>
          </div>
          <div className={`info-card__text${tv?' info-card__text--visible':''}`}>
            <span className="info-card__handwriting">{handwriting}</span>
          </div>
        </div>
      );
    }

    function AboutCollageSection(){
      const pathRef=useRef(null);
      useEffect(()=>{
        if(!pathRef.current)return;
        const total=pathRef.current.getTotalLength();
        pathRef.current.style.strokeDasharray=total;
        pathRef.current.style.strokeDashoffset=total;
        const onScroll=()=>{
          const sec=pathRef.current?.closest('.ac-section');
          if(!sec)return;
          const r=sec.getBoundingClientRect();
          const p=Math.max(0,Math.min(1,(window.innerHeight-r.top)/(window.innerHeight+r.height*.5)));
          pathRef.current.style.strokeDashoffset=total*(1-p);
        };
        window.addEventListener('scroll',onScroll,{passive:true});onScroll();
        return()=>window.removeEventListener('scroll',onScroll);
      },[]);
      return(
        <section className="ac-section">
          <div className="ac-section__header">
            <span className="ac-eyebrow">In Context</span>
            <h2 className="ac-title">A few things<br/><em>about me</em></h2>
          </div>
          <div className="ac-section__collage">
            <svg className="ac-doodle" viewBox="0 0 900 700" fill="none" aria-hidden="true">
              <path ref={pathRef} d="M 720 40 C 720 100, 620 120, 520 160 C 420 200, 320 200, 240 260 C 160 320, 140 380, 160 440 C 180 500, 240 520, 320 540 C 400 560, 480 560, 540 600 C 600 640, 660 660, 700 680" stroke="rgba(189,217,159,0.5)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
              {[40,160,280,400,520,640].map(n=><circle key={n} cx={720-n*.4} cy={40+n*.92} r="3" fill="rgba(189,217,159,0.35)"/>)}
            </svg>
            <div className="ac-card ac-card--ux"><AboutInfoCard img="assets/ux-icon.png" handwriting={"My focus is on creating\nuser-centered &\ninclusive solutions\nfor all users"} label="UX Design" rotation="-4deg" accentColor="var(--green)"/></div>
            <div className="ac-card ac-card--edu"><AboutInfoCard img="assets/edu-icon.png" handwriting={"I'm a master's student\nin Human-Computer\nInteraction at\nDePaul University"} label="Education" rotation="3deg" accentColor="var(--amber)"/></div>
            <div className="ac-card ac-card--chicago"><AboutInfoCard img="assets/chicago-icon.png" handwriting={"I live in\nChicago ✦"} label="Chicago" rotation="-2deg" accentColor="var(--purple)"/></div>
          </div>
        </section>
      );
    }

    function AboutHackathonSection(){
      const ref=useRef(null),imgRef=useRef(null);const[rev,setRev]=useState(false);
      useEffect(()=>{
        const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting)setRev(true);},{threshold:.2});
        if(ref.current)obs.observe(ref.current);
        const fn=()=>{
          if(!imgRef.current)return;
          const r=imgRef.current.getBoundingClientRect();
          const p=Math.max(0,Math.min(1,(window.innerHeight-r.top)/(window.innerHeight+r.height)));
          imgRef.current.style.transform=`scale(${1+p*.06})`;
        };
        window.addEventListener('scroll',fn,{passive:true});
        return()=>{obs.disconnect();window.removeEventListener('scroll',fn);};
      },[]);
      return(
        <section className="ahack-section" ref={ref}>
          <div className="ahack-section__inner">
            <div className="ahack-section__header">
              <span className="ac-eyebrow">Real Work, Real People</span>
              <h2 className="ac-title">DePaul<br/><em>DemonHacks</em></h2>
            </div>
            <div className="ahack-layout">
              <div className="ahack-photo-wrap">
                <div className="ahack-photo-clip"><img ref={imgRef} src="assets/hackathon.jpg" alt="Anusha at DemonHacks" className="ahack-photo"/></div>
                <div className={`ahack-annotation ahack-annotation--me${rev?' ann-visible':''}`}>
                  <span className="ann-arrow">↙</span>
                  <span className="ann-text" style={{fontFamily:'var(--hand)',fontSize:26}}>This is me</span>
                </div>
                <div className="ahack-frame-corner ahack-frame-corner--tl"/>
                <div className="ahack-frame-corner ahack-frame-corner--tr"/>
                <div className="ahack-frame-corner ahack-frame-corner--bl"/>
                <div className="ahack-frame-corner ahack-frame-corner--br"/>
              </div>
              <div className={`ahack-info${rev?' ahack-info--visible':''}`}>
                <p className="ahack-caption" style={{fontFamily:'var(--hand)',fontSize:28,lineHeight:1.35}}>
                  Picture from the recent<br/>DePaul Hackathon — DemonHacks
                </p>
                <p className="ahack-body">A 48-hour sprint designing accessible, user-centered solutions under pressure. One of my most energizing experiences — rapid research, ideation, and prototyping with a brilliant team.</p>
                <a href="https://github.com/Dhruvachaitanya13/Nexora.git" target="_blank" rel="noopener" className="ahack-cta">Check out the project we worked on <span>→</span></a>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function AboutSection(){
      return(
        <section id="about" className="about">
          <AboutHeroSection/>
          <AboutQuoteSection/>
          <AboutCollageSection/>
          <AboutHackathonSection/>
        </section>
      );
    }

    /* ══ FOOTER ═════════════════════════════════════════════════════ */
    function Footer(){
      const ref=useRef(null);const[rev,setRev]=useState(false);
      useEffect(()=>{const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting)setRev(true);},{threshold:.05});if(ref.current)obs.observe(ref.current);return()=>obs.disconnect();},[]);
      return(
        <footer className="footer" id="contact" ref={ref}>
          <div className="footer__line" style={{transform:rev?'scaleX(1)':'scaleX(0)',transition:'transform 1.8s cubic-bezier(0.16,1,0.3,1)'}}/>
          <div className="footer__inner">
            <Reveal><div className="footer__lbl">06 — Get In Touch</div></Reveal>
            <div className="footer__title-wrap">
              <Reveal delay={.1}><span className="footer__tline">Let's work</span></Reveal>
              <Reveal delay={.22}><span className="footer__tline footer__tline--em"><em>together.</em></span></Reveal>
            </div>
            <Reveal delay={.38}><a href="mailto:anushaprasad20@gmail.com" className="footer__email">anushaprasad20@gmail.com <span className="footer__earrow">↗</span></a></Reveal>
            <div className="footer__bottom">
              <div className="footer__socials">
                {[['LinkedIn','https://www.linkedin.com/in/anushaprasad20/'],['Resume',RESUME]].map(([l,h])=>(
                  <a key={l} href={h} target="_blank" rel="noopener" className="footer__social">{l} <span>↗</span></a>
                ))}
              </div>
              <div className="footer__rhs">
                <span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--faint)'}}>Chicago, IL · 2026</span>
                <span className="footer__copy">© 2026 Anusha Prasad</span>
              </div>
            </div>
          </div>
          <div className="footer__bg">AP</div>
        </footer>
      );
    }

    function App(){
      const[active,setActive]=useState('hero');
      const[t,setTweak]=useTweaks(/*EDITMODE-BEGIN*/{"accentColor":"#BDD99F"}/*EDITMODE-END*/);
      useEffect(()=>{
        const ids=['hero','bio','projects','skills','contact'];
        const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)setActive(e.target.id);});},{threshold:.3});
        ids.forEach(id=>{const el=document.getElementById(id);if(el)obs.observe(el);});
        return()=>obs.disconnect();
      },[]);
      useEffect(()=>{document.documentElement.style.setProperty('--green',t.accentColor||'#BDD99F');},[t.accentColor]);
      return(
        <>
          <Nav active={active}/>
          <main>
            <Hero/><Marquee/>
            <SDivider/><Bio/>
            <SDivider/><Projects/>
            <SDivider/><Skills/>
            <SDivider/><Footer/>
          </main>
          <TweaksPanel>
            <TweakSection label="Brand"/>
            <TweakColor label="Accent color" value={t.accentColor} onChange={v=>setTweak('accentColor',v)}/>
          </TweaksPanel>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
